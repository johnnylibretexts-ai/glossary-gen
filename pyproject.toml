[project]
name = "glossary-gen"
version = "0.1.0"
description = "Generate page-grounded glossary definitions for LibreTexts books"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12,<0.13"]

[project.scripts]
glossary-gen = "glossary_gen.cli:run"
glossary-scan = "glossary_gen.scan_cli:run"

[build-system]
requires = ["setuptools>=77"]  # PEP 639 bare-SPDX `license` needs >=77
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
glossary_gen = ["prompts/*.md", "prompts/scan/*.md", "prices.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
